name: Domain Visit (Random)

on:
  push:
    branches: [main]
  pull_request:
    # Informational status check on PRs targeting main — not blocking in branch
    # protection, since the random brand×locale pick can flake for reasons
    # unrelated to the PR's changes.
    branches: [main]
  # Hourly smoke against a random brand × language.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  domain-visit-random:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run domain_visit.cy.js against a random brand × language
        run: npm run cypress:run:random
        env:
          # Optional: set the SLACK_WEBHOOK_URL repo secret to post run summaries
          # to Slack. Unset → run-random.js skips notification silently.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-results
          path: |
            cypress/results/screenshots
            cypress/results/videos
            cypress/results/final-report.html
            lighthouse-reports
